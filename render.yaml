services:
  - type: web
    name: hisoblash-finance-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: python -m app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/finance.db
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
