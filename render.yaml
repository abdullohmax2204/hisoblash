services:
  - type: web
    name: hisoblash-finance-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: mkdir -p data && pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: python -m app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: EMERGENCY_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_SYNC_INTERVAL_SECONDS
        value: 60
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/finance.db
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.0
